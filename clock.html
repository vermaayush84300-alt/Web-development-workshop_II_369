<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Circular Living System</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: linear-gradient(to right, #e3f2fd, #e8f5e9);
      padding: 20px;
    }

    h1 {
      color: #2e7d32;
    }

    select, button {
      padding: 10px;
      margin-top: 20px;
      font-size: 16px;
    }

    .card {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
      display: inline-block;
      width: 300px;
    }

    #result {
      margin-top: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <h1>♻️ Smart Circular Living System</h1>
  <p>Select waste type and get smart suggestions</p>

  <select id="wasteType">
    <option value="">-- Select Waste Type --</option>
    <option value="plastic">Plastic Bottle</option>
    <option value="metal">Metal Can</option>
    <option value="paper">Paper</option>
    <option value="ewaste">E-Waste</option>
    <option value="cloth">Clothes</option>
  </select>

  <br>
  <button onclick="getSuggestion()">Get Suggestion</button>

  <div class="card">
    <div id="result">Result will appear here...</div>
  </div>

  <script>
    function getSuggestion() {
      let type = document.getElementById("wasteType").value;
      let result = "";

      if (type === "plastic") {
        result = "♻️ Plastic Bottle\n\nReuse as plant pot 🌱\nOr send to recycling center\nEco Score: +15 🌍";
      }
      else if (type === "metal") {
        result = "🥫 Metal Can\n\nReuse as storage or recycle\nEco Score: +12 🌍";
      }
      else if (type === "paper") {
        result = "📄 Paper\n\nReuse for notes or recycle\nEco Score: +8 🌍";
      }
      else if (type === "ewaste") {
        result = "💻 E-Waste\n\nSend to certified e-waste recycler\nEco Score: +20 🌍";
      }
      else if (type === "cloth") {
        result = "👕 Clothes\n\nDonate or convert into bags\nEco Score: +10 🌍";
      }
      else {
        result = "⚠️ Please select a waste type";
      }

      document.getElementById("result").innerText = result;
    }
  </script>

</body>
</html>
